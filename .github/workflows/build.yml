# Fetch, build, verify and publish the list.
#
# The workflow never publishes an unverified list: tools/audit.js and tools/coverage-gap.js both
# exit non-zero when the product regresses, and they run before the commit step. A failing run
# leaves the previously published file in place, so subscribers keep the last known-good list
# instead of receiving a broken one.
#
# Why this is ordinary, permitted use of GitHub Actions rather than abuse: one short job a day on a
# public repository, running on standard GitHub-hosted runners well inside the free allowance, with
# a hard 45-minute timeout and a single-run concurrency group so it can never pile up. It downloads
# public domain lists, rebuilds a text file, and commits it back to the same repository. There is no
# commercial resale, no proxying or mining, no attempt to evade rate limits, and no private data.
name: build

on:
  schedule:
    # Daily at 03:17 UTC. Off the hour on purpose: GitHub's scheduled runners are heavily
    # congested at :00, and a delayed start is the most common cause of a skipped cron run.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_refetch:
        description: 'Re-download every feed even if the cache looks fresh'
        type: boolean
        default: false
  push:
    branches: [main]
    # A documentation-only change must not trigger a 10-minute feed download. These are the paths
    # whose contents any gate in tools/ reads, though: a licence, a feed entry or a policy file can
    # change a verdict without changing a single rule, and a run is the only thing that checks.
    paths:
      - 'tools/**'
      - 'data/**'
      - 'package.json'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
      - 'CODE_OF_CONDUCT.md'
      - '.github/workflows/build.yml'

# One publishing run at a time; a queued run supersedes a waiting one.
concurrency:
  group: build-list
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore feed cache
        # Feed bodies change rarely; restoring them turns a cold 10-minute fetch into a warm
        # 30-second build. `restore-keys` without a run-id suffix means the most recent cache is
        # always reused, and a fresh one is written by the step below.
        uses: actions/cache@v4
        with:
          path: .cache/sources
          key: feeds-${{ github.run_id }}
          restore-keys: |
            feeds-

      - name: Install hostlist-compiler
        # The compiler is invoked through the HOSTLIST_COMPILER environment variable, so its
        # location inside node_modules is resolved here rather than hard-coded in tools/build.js.
        run: |
          npm install --no-audit --no-fund
          node -e "
            const path = require('path');
            const entry = require.resolve('@adguard/hostlist-compiler/src/index.js');
            console.log('compiler entry:', entry);
            require('fs').appendFileSync(process.env.GITHUB_ENV, 'HOSTLIST_COMPILER=' + entry + '\n');
          "

      - name: Fetch feeds
        run: node tools/fetch.js ${{ inputs.force_refetch && '--force' || '' }}

      - name: Build
        env:
          DNS_SHIELD_HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: node tools/build.js

      - name: Audit
        run: node tools/audit.js

      - name: Coverage reconciliation
        # Fails when a rule reaches the emitted set but not the published file, or when a peer rule
        # is unaccounted for by any release path.
        run: node tools/coverage-gap.js

      - name: Capture the previously published list
        # Must run before anything overwrites dist/, so the regression budget has a baseline. On a
        # fresh checkout the file is absent and the check reports that it had nothing to compare.
        run: |
          if git cat-file -e "HEAD:dist/dns-shield.txt" 2>/dev/null; then
            git show "HEAD:dist/dns-shield.txt" > dist/previous.txt
            echo "baseline: HEAD:dist/dns-shield.txt"
          else
            echo "baseline: none (first publish)"
          fi

      - name: Regression budget
        # Refuses a run that collapses coverage or lets the exception section run away. None of the
        # checks above compare today's product against yesterday's.
        run: node tools/ci-regression.js

      - name: Benchmark
        run: node tools/benchmark.js

      - name: Product statistics
        run: node tools/write-stats.js

      - name: Regenerate source documentation
        run: node tools/gen-sources-doc.js

      - name: Regenerate the referral-gap report
        # Documents what an allowlist filter would release from the list being published. Generated
        # rather than written by hand so it cannot drift away from the rules it describes.
        run: node tools/referral-gaps.js

      - name: Verify (push)
        # `npm run verify` is the same gate a maintainer runs locally. It is out-of-band here: a push
        # to main is the one moment when a change that no longer passes can be caught before a
        # subscriber receives it, and the gates it re-runs are the whole point of the project being
        # reviewable. Skipped on schedules and manual runs, which verify inline above.
        if: github.event_name == 'push'
        run: npm run verify

      - name: Publish
        # `git pull --rebase` before the push is not optional: a scheduled run can start from a
        # commit that a human push supersedes while the feeds are still downloading, and a plain
        # push then fails with "fetch first" even though the build itself was perfect. Rebasing
        # replays the one build commit on top of whatever landed meanwhile. If the concurrent
        # commit already published identical dist/ bytes, the rebase drops this commit entirely and
        # the push becomes a no-op - which is the desired outcome, not a lost update.
        run: |
          git config user.name  'dns-shield-bot'
          git config user.email 'dns-shield-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no change to publish'
            exit 0
          fi
          BLOCK=$(node -e "console.log(require('./dist/stats.json').blockRules.toLocaleString('en-US'))")
          ALLOW=$(node -e "console.log(require('./dist/stats.json').allowRules)")
          SIZE=$(node -e "console.log(require('./dist/stats.json').mib)")
          git commit -m "build: ${BLOCK} block rules, ${ALLOW} exceptions, ${SIZE} MiB"
          git -c rebase.autoStash=true pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          # Second attempt covers the narrow window between the rebase and the push.
          git push || { sleep 5; git -c rebase.autoStash=true pull --rebase --autostash origin "${GITHUB_REF_NAME}"; git push; }

      - name: Report feed availability
        # Runs after Publish on purpose: a missing feed must never keep the previous list in place, and
        # what the subscriber needs (a valid list) has already been delivered by then. The distinction
        # mirrors tools/build.js - a missing source the list is built from refuses the build, so it
        # cannot reach this step; only optional sources can, and they are reported without turning the
        # run red. A quietly narrowed list deserves a notice, not a red X on a repository whose
        # published list is correct.
        run: |
          if [ ! -f dist/build.log ]; then
            echo 'no build log to inspect'
            exit 0
          fi
          if grep -q 'MISSING SOURCES:' dist/build.log; then
            echo '::error::a source the list is built from was missing - the build should have refused'
            grep -A5 'MISSING SOURCES:' dist/build.log
            exit 1
          fi
          if grep -q 'optional source(s) missing' dist/build.log; then
            echo '::notice title=List published without an optional feed::a flaky upstream was down, so this run is narrower than usual'
            grep -A5 'optional source(s) missing' dist/build.log
          else
            echo 'all sources present'
          fi
